<!DOCTYPE html> <!-- Defines the document type as html -->
<html>
<!-- Defines the root of an HTML document -->

<head>
    <!-- Contains metadata/information for the document -->
    <meta charset="utf-8"> <!-- Defines metadata charset as Unicode Transformation Format -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Defines metadata to specify for which version of Internet Explorer the page should be rendered as -->
    <title> Page Title </title> <!-- Defines a title for the document -->
    <meta name="description" content="">
    <!-- Defines metadata name attribute to define a description, keywords, or the author of an HTML document -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Defines metadata viewport to control the page's dimensions and scaling for different devices -->
    <link rel="stylesheet" href="">
    <!-- Defines the relationship between a document and an external resource in this case a stylesheet-->
</head>

<body>
    <!-- Defines the document's body -->
    <script src="" async defer></script> <!-- Defines a client-side script -->
    <h1> Header 1 </h1> <!-- Defines HTML headings -->
    <p> Paragraph </p>  <!-- Defines a paragraph -->
    <h2> Header 2 </h2> <!-- Defines HTML headings -->
    <p> Paragraph </p>  <!-- Defines a paragraph -->
    <h3> Header 3 </h3> <!-- Defines HTML headings -->
    <p> Paragraph </p>  <!-- Defines a paragraph -->
    <h4> Header 4 </h4> <!-- Defines HTML headings -->
    <p> Paragraph </p>  <!-- Defines a paragraph -->
    <h5> Header 5 </h5> <!-- Defines HTML headings -->
    <p> Paragraph </p>  <!-- Defines a paragraph -->
    <h6> Header 6 </h6> <!-- Defines HTML headings -->
    <p> Paragraph </p>  <!-- Defines a paragraph -->
</body>

</html>
