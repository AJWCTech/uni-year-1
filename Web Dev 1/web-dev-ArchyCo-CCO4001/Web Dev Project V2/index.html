<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Pong Game</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <div id="pause" style="display: none;">Pause</div>
    <div class="game-container" id="game">
        <canvas id="pong" style="display: none;" width="1500" height="800"></canvas>
    </div>
    <div id="start" style="display: block;">
        <h2>Make sure you!! The user have your mouse inside the rectangle box outline to control your player pad, you
            control your paddle by moving the mouse up and down, the game is 1 V C (1 vs Computer) first to 10 points
            Wins! Good luck...</h2>
        <a href="#" onclick="startGame()">Start Game</a>
    </div>
    <div id="game-over" style="display:none">
        <h1>Game Over</h1>
        <a href="#" onclick="startGame()">Start Game</a>
    </div>
    <script src="pong.js">
    </script>
</body>

</html>
