<!DOCTYPE html> <!-- Document type declaration as HTML -->
<html lang="en"> <!-- Declaring the language as english for the HTML document -->
<head> <!-- Head element to contain elements such as Title, link and meta -->
    <meta charset="utf-8">
    <!-- Meta tag defines metadata in this case it specifies the charset (character encoding) for the HTML document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tag defines metadata and in this case it sets the viewport so it fits on all devices -->
    <title>Know Your Cyber</title> <!-- Title sets the title of the page in browser -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> <!-- Link links to the CSS stylesheet the URL for the stylesheet is dynamically generated using Flask's url_for() function -->
</head>
<body> <!-- Defines the HTML body to contain headings, footers, navs, paragraphs, sections and lists -->
    <header> <!-- Defines the HTML header which represents a container for intros or nav links -->
        <h1>KnowYourCyber</h1> <!-- h1-h6 tags are used to define HTML headings values can be customised using CSS -->
        <nav> <!-- Nav tag defines a set of navigation links and ul tag defines an unordered list-->
            <a href="{{ url_for('index') }}">Home</a> <!-- a href attribute specifies the the URL is dynamically generated using Flask's url_for() function which goes to index -->
            <a href="{{ url_for('database') }}">Database</a> <!-- a href attribute specifies the the URL is dynamically generated using Flask's url_for() function which goes to database -->
            <a href="{{ url_for('about') }}">About</a> <!-- a href attribute specifies the the URL is dynamically generated using Flask's url_for() function which goes to index -->
        </nav>
    </header>
    <main> <!-- Main content area of page -->
        {% block content %}{% endblock %} <!-- This is Jinja2 template syntax used to define a block called content and then endblock is used to define boundries of blocks in Jinja2 templates, making content reuse and custom template inheritance and block nesting easier (Flask, 2010b) -->
    </main>
</body>
</html>
